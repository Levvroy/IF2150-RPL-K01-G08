# Alternatif bagi yang tidak memasang PostgreSQL native.
# Port 5433 dipakai agar tidak bentrok dengan PostgreSQL native di 5432.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: sigap
      POSTGRES_PASSWORD: sigap
      POSTGRES_DB: sigap
    ports:
      - "5433:5432"
    volumes:
      - sigap-data:/var/lib/postgresql/data

volumes:
  sigap-data:
