<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Masuk ke SIGAP</title>
  <link rel="stylesheet" href="/sigap.css">
  <link rel="stylesheet" href="/relawan/login.css">
</head>
<body>
  <div class="latar lebar" aria-hidden="true"></div>
  <div class="laptop">
    <main class="kolom-masuk" id="halaman" data-keadaan="isi">
      <div class="merek">
        <img src="/gambar/logo-sigap.png" alt="Logo SIGAP">
        <span>SIGAP</span>
      </div>
      <div class="isi">
        <h1 class="teks-judul">Masuk ke SIGAP</h1>
        <div id="pesan-luring" class="banner" role="status" hidden>
          <svg class="ikon" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 20h.01" /><path d="M8.5 16.429a5 5 0 0 1 7 0" /><path d="M5 12.859a10 10 0 0 1 5.17-2.69" />
            <path d="M19 12.859a10 10 0 0 0-2.007-1.523" /><path d="M2 8.82a15 15 0 0 1 4.177-2.643" />
            <path d="M22 8.82a15 15 0 0 0-11.288-3.764" /><path d="m2 2 20 20" />
          </svg>
          <span>Tidak ada koneksi</span>
        </div>
        <form id="form-login" class="form-masuk" novalidate>
          <div class="baris">
            <label for="username">Username</label>
            <input id="username" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="contoh: arga.simanjuntak">
          </div>
          <div class="baris ada-mata">
            <label for="password">Password</label>
            <input id="password" type="password" autocomplete="current-password" placeholder="Wajib diisi">
            <button type="button" id="tombol-mata" class="tombol-mata" aria-label="Tampilkan password" hidden>
              <svg class="ikon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" />
                <circle cx="12" cy="12" r="3" />
                <path class="coret" d="m2 2 20 20" hidden />
              </svg>
            </button>
          </div>
        </form>
        <p id="petunjuk-kosong" hidden></p>
        <p id="pesan-gagal" class="pesan-gagal teks-catatan" role="alert" hidden>
          <svg class="ikon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
            <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3" /><path d="M12 9v4" /><path d="M12 17h.01" />
          </svg>
          <span></span>
        </p>
        <button id="tombol-masuk" class="tombol-utama" type="submit" form="form-login" disabled>Masuk</button>
        <p class="bantuan teks-catatan">Akun dibuat oleh koordinator posko. Lupa password? Hubungi koordinator.</p>
      </div>
      <p class="teks-catatan"></p>
    </main>
    <aside class="panel-peta" aria-label="Ilustrasi peta risiko">
      <h2>Peta risiko per petak 1 km</h2>
      <div class="grid-petak" aria-hidden="true">
        <span class="rendah"></span><span class="rendah"></span><span class="rendah"></span><span class="sedang"></span><span class="sedang"></span><span class="rendah"></span><span class="rendah"></span><span class="rendah"></span>
        <span class="rendah"></span><span class="rendah"></span><span class="sedang"></span><span class="sedang"></span><span class="tinggi"></span><span class="sedang"></span><span class="rendah"></span><span class="rendah"></span>
        <span class="rendah"></span><span class="sedang"></span><span class="sedang"></span><span class="tinggi"></span><span class="tinggi"></span><span class="sedang"></span><span class="sedang"></span><span class="rendah"></span>
        <span class="rendah"></span><span class="rendah"></span><span class="sedang"></span><span class="tinggi"></span><span class="sedang"></span><span class="sedang"></span><span class="rendah"></span><span class="rendah"></span>
        <span class="rendah"></span><span class="rendah"></span><span class="rendah"></span><span class="sedang"></span><span class="sedang"></span><span class="rendah"></span><span class="rendah"></span><span class="rendah"></span>
        <span class="rendah"></span><span class="rendah"></span><span class="rendah"></span><span class="rendah"></span><span class="sedang"></span><span class="rendah"></span><span class="rendah"></span><span class="rendah"></span>
      </div>
      <div class="legenda">
        <span><i class="tinggi"></i>Tinggi</span>
        <span><i class="sedang"></i>Sedang</span>
        <span><i class="rendah"></i>Rendah</span>
      </div>
    </aside>
  </div>
  <script type="module" src="/relawan/js/HalamanLogin.js"></script>
</body>
</html>
